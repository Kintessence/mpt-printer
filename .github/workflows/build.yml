name: Build and Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repositório
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Aceitar Licenças Android
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Compilar APK Debug
      run: |
        gradle wrapper --gradle-version 8.5
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Renomear APK para nome amigável
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/AirPrinter.apk

    - name: Publicar Release com APK direto
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: "Air Printer - Versão Atualizada"
        body: "APK pronto para download e instalação direta no Android."
        draft: false
        prerelease: false
        files: app/build/outputs/apk/debug/AirPrinter.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}