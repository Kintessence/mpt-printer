name: Build and Release APK

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Dar permissão de execução ao gradlew
      run: chmod +x gradlew

    - name: Compilar APK Debug Unificado
      run: ./gradlew assembleDebug

    - name: Renomear APK para distribuição
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk AirPrinter.apk

    - name: Publicar Release Oficial no GitHub
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v2.9.4
        name: Air Printer v2.9.4
        make_latest: true
        body: |
          Versão v2.9.4 oficial:
          - Visualizador térmico monoespaçado de 32 colunas editável
          - Envio nativo em UTF-8 puro validado
          - Alinhamento do pipeline de atualização contínua
        files: AirPrinter.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}