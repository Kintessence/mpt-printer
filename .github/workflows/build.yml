name: Build and Release APK

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do cÃ³digo
      uses: actions/checkout@v4

    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # Se release.jks jÃ¡ estiver commitado, usa ele; senÃ£o usa chave fixa base64 segura
    - name: Restaurar ou Criar Keystore EstÃ¡vel
      run: |
        if [ ! -f app/release.jks ]; then
          keytool -genkeypair -v -keystore app/release.jks -alias airprinter -keyalg RSA -keysize 2048 -validity 10000 -storepass airprinter123 -keypass airprinter123 -dname "CN=AirPrinter, OU=Dev, O=AirPrinter, L=VilaVelha, ST=ES, C=BR"
        fi

    - name: Dar permissÃ£o de execuÃ§Ã£o ao gradlew
      run: chmod +x gradlew

    - name: Compilar APK Release Assinado
      run: ./gradlew assembleRelease

    - name: Renomear APK para nome amigÃ¡vel
      run: |
        cp app/build/outputs/apk/release/app-release.apk AirPrinter.apk

    - name: Criar Release no GitHub
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v2.9.3
        name: Air Printer v2.9.3
        body: |
          VersÃ£o v2.9.1 com comparador semÃ¢ntico de versÃ£o e solicitaÃ§Ã£o antecipada de permissÃ£o de instalaÃ§Ã£o.
        files: AirPrinter.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}