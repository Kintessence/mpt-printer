name: Build and Release APK

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Gerar Keystore Fixa de Build
      run: |
        keytool -genkey -v -keystore app/release.jks -alias airprinter -keyalg RSA -keysize 2048 -validity 10000 -storepass airprinter123 -keypass airprinter123 -dname "CN=AirPrinter, OU=Dev, O=AirPrinter, L=VilaVelha, ST=ES, C=BR"

    - name: Dar permissão de execução ao gradlew
      run: chmod +x gradlew

    - name: Compilar APK Release Assinado
      run: ./gradlew assembleRelease

    - name: Renomear APK para nome amigável
      run: |
        cp app/build/outputs/apk/release/app-release.apk AirPrinter.apk

    - name: Criar Release no GitHub
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v2.9
        name: Air Printer v2.9
        body: |
          Versão v2.9 com UTF-8 nativo validado e assinatura fixa unificada.
        files: AirPrinter.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}