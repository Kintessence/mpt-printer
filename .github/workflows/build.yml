name: Build and Release APK & AAB

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.6'

    - name: Compilar APK Github e Bundle PlayStore
      run: |
        gradle assembleGithubDebug
        gradle bundlePlaystoreRelease

    - name: Preparar Artefatos
      run: |
        cp app/build/outputs/apk/github/debug/app-github-debug.apk AirPrinter.apk
        cp app/build/outputs/bundle/playstoreRelease/app-playstore-release.aab AirPrinter-playstore.aab

    - name: Publicar Release Oficial no GitHub
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v2.9.5
        name: Air Printer v2.9.5
        make_latest: true
        body: |
          Versão v2.9.5:
          - AirPrinter.apk (distribuição direta com auto-update)
          - AirPrinter-playstore.aab (pacote homologado para a Google Play Store)
        files: |
          AirPrinter.apk
          AirPrinter-playstore.aab
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}